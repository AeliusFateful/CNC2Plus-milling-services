# Сборка статического сайта (Next.js, output: "export") и публикация на GitHub Pages.
#
# basePath и assetPrefix задаются в next.config.mjs, поэтому actions/configure-pages здесь
# не используется: он переписывал next.config.mjs и ломал его (подставлял строку вместо
# `basePath,`), из-за чего `next build` падал с кодом 1.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой; уже запущенный не отменяем, чтобы он дошёл до конца.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Проверка типов входит в `next build`.
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
